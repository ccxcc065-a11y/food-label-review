name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 已不再提供 3.9 的预编译版本，3.9 固定在 22.04。
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 离线套件不需要 Pillow / pypdf / OCR / 网络，也不需要标准正文。
      - name: offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    name: front-end rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --test
        run: node --test tests/test_report.js

  public-demo:
    name: clean checkout / browser assets / saved report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - name: start demo without OCR or model credentials
        run: |
          python server.py --demo --port 18765 > /tmp/food-label-demo.log 2>&1 &
          echo $! > /tmp/food-label-demo.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('demo server did not become ready')
          PY
      - run: python scripts/check_demo.py http://127.0.0.1:18765
      - name: stop demo
        if: always()
        run: |
          if [ -f /tmp/food-label-demo.pid ]; then kill "$(cat /tmp/food-label-demo.pid)" || true; fi
          cat /tmp/food-label-demo.log || true
